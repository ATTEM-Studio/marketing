project_id = "buyer-sales-coach"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
enable_anonymous_sign_ins = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/?auth=callback"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.redeem-invite]
verify_jwt = true

[functions.finalize-registration]
verify_jwt = true

[analytics]
enabled = false
